name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove secrets and private paths before submitting logs.
  - type: input
    id: version
    attributes:
      label: HyprConfig version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution and Hyprland, Python, GTK, libadwaita, and Waybar versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and private information.
          required: true
        - label: My dotfiles are backed up or committed.
          required: true
