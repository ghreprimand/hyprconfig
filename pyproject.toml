[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprconfig"
version = "0.1.0"
description = "A GTK4 configuration companion for Hyprland"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "third_party/licenses/*"]
keywords = ["hyprland", "wayland", "gtk4", "waybar", "linux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ghreprimand/hyprconfig"
Repository = "https://github.com/ghreprimand/hyprconfig"
Issues = "https://github.com/ghreprimand/hyprconfig/issues"

[project.scripts]
hyprconfig = "hyprconfig.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyprconfig = ["data/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
